<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
	<link rel="stylesheet" href="style.css">
	<script>
		let language = "en"
	</script>
	<script src="main.js" type="module" defer></script>
	<title>Opus Minor</title>
</head>

<body data-bs-theme="dark">
	<canvas id="screen"></canvas>
	<div id="components">
		<div id="components-products" class="components-section">
			<p class="components-label">Products</p>
			<div class="components-list"></div>
		</div>
		<div id="components-reagents" class="components-section">
			<p class="components-label">Reagents</p>
			<div class="components-list"></div>
		</div>
		<div id="components-mechanisms" class="components-section">
			<p class="components-label">Mechanisms</p>
			<div class="components-list"></div>
		</div>
		<div id="components-glyphs" class="components-section">
			<p class="components-label">Glyphs</p>
			<div class="components-list"></div>
		</div>
	</div>
	<div id="components-tab" class="ui-tab">
		<span class="tab-label"><i class="bi bi-wrench"></i></span>
	</div>
	<div id="bottom-pane">
		<div id="instruction-pane">
			<div id="instructions"></div>
			<div id="playback-pane">
				<button class="btn btn-primary" id="playback-stop-button">
					<i class="bi bi-stop-fill"></i>
				</button>
				<button class="btn btn-primary" id="playback-pause-button">
					<i class="bi bi-pause-fill"></i>
				</button>
				<button class="btn btn-primary" id="playback-play-button">
					<i class="bi bi-play-fill"></i>
				</button>
			</div>
		</div>
		<div id="program-pane">
			<div id="program-names"></div>
			<div id="program-rows-wrapper">
				<div id="program-rows"></div>
			</div>
		</div>
	</div>
	<div id="program-tools">
		<div id="program-stats">
			<div class="program-stat" data-stat="products">
				<span class="program-stat-name">PRODUCTS:</span>
				<span class="program-stat-val">0/6</span>
			</div>
			<div class="program-stat" data-stat="cost">
				<span class="program-stat-name">COST:</span>
				<span class="program-stat-val">0<span class="tiny-g">G</span></span>
			</div>
			<div class="program-stat" data-stat="cycle">
				<span class="program-stat-name">CYCLES:</span>
				<span class="program-stat-val">0</span>
			</div>
			<div class="program-stat" data-stat="area">
				<span class="program-stat-name">AREA:</span>
				<span class="program-stat-val">0</span>
			</div>
			<div class="program-stat" data-stat="instructions">
				<span class="program-stat-name">INSTRUCTIONS:</span>
				<span class="program-stat-val">0</span>
			</div>
		</div>
	</div>
	<div id="modal" class="modal modal-xl fade" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title"></h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body"></div>
				<div class="modal-footer"></div>
			</div>
		</div>
	</div>
	<div id="debug"></div>
	<div id="tooltip"></div>
	<div id="loading-screen">
		Loading...
	</div>
</body>

</html>
