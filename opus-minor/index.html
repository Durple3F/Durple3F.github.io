<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
	<link rel="stylesheet" href="style.css">
	<script>
		const version = 0.1
		let language = "en"
	</script>
	<script src="main.js" type="module" defer></script>
	<title>Opus Minor</title>
</head>

<body data-bs-theme="dark">
	<div id="game-ui" class="game-scene">
		<canvas id="screen"></canvas>
		<div id="components">
			<div id="components-contents">
				<div id="components-products" class="components-section">
					<div class="components-list"></div>
					<div class="components-section-bg"></div>
					<p class="components-label">Products</p>
				</div>
				<div id="components-reagents" class="components-section">
					<div class="components-list"></div>
					<div class="components-section-bg"></div>
					<p class="components-label">Reagents</p>
				</div>
				<div id="components-mechanisms" class="components-section">
					<div class="components-list"></div>
					<div class="components-section-bg"></div>
					<p class="components-label">Mechanisms</p>
				</div>
				<div id="components-glyphs" class="components-section">
					<div class="components-list"></div>
					<div class="components-section-bg"></div>
					<p class="components-label">Glyphs</p>
				</div>
			</div>
		</div>
		<div id="components-tab" class="ui-tab">
			<span class="tab-label"><i class="bi bi-wrench"></i></span>
		</div>
		<canvas id="program-screen"></canvas>
		<div id="bottom-pane">
			<div id="instruction-pane">
				<div id="instructions"></div>
			</div>
			<div id="program-pane">
				<div id="program-names"></div>
				<div id="program-rows-wrapper">
					<div id="program-rows"></div>
				</div>
			</div>
		</div>
		<div id="program-tools">
			<div id="program-stats">
				<div class="program-stat" data-stat="products">
					<span class="program-stat-name">PRODUCTS:</span>
					<span class="program-stat-val">0/6</span>
				</div>
				<div class="program-stat" data-stat="cost">
					<span class="program-stat-name">COST:</span>
					<span class="program-stat-val">0<span class="tiny-g">G</span></span>
				</div>
				<div class="program-stat" data-stat="cycle">
					<span class="program-stat-name">CYCLES:</span>
					<span class="program-stat-val">0</span>
				</div>
				<div class="program-stat" data-stat="area">
					<span class="program-stat-name">AREA:</span>
					<span class="program-stat-val">0</span>
				</div>
				<div class="program-stat" data-stat="instructions">
					<span class="program-stat-name">INSTRUCTIONS:</span>
					<span class="program-stat-val">0</span>
				</div>
			</div>
		</div>
		<canvas id="screen-effects"></canvas>
	</div>
	<div id="story" class="game-scene" style="display: none">
		<div id="story-bg"></div>
		<div id="story-title"></div>
		<div id="story-characters"></div>
		<div id="story-dialogue">
			<div id="story-dialogue-bg"></div>
			<div id="story-dialogue-name"></div>
			<div id="story-dialogue-text"></div>
		</div>
	</div>
	<div id="game-menu">
		<div id="level-select-bg"></div>
		<canvas id="level-select-bg-canvas"></canvas>
		<div id="level-chapter-title"></div>
		<div id="level-select">
			<div id="level-select-header">
				<div class="level-select-name"></div>
				<div class="level-select-subtitle"></div>
			</div>
			<hr>
			<div id="level-select-content"></div>
		</div>
		<div id="level-select-chapter-container">
			<div id="level-select-chapter-container-bg"></div>
		</div>
		<div id="options-container" class="level-select-btn">
			<img class="img_inactive" src="./src/img/puzzle-select/options.png">
			<img class="img_active" src="./src/img/puzzle-select/options_hover.png">
		</div>
	</div>
	<div id="document-modal" class="modal fade" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div id="document-constraint">
					<div id="document-container"></div>
				</div>
			</div>
		</div>
	</div>
	<div id="modal" class="modal modal-xl fade" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title"></h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body"></div>
				<div class="modal-footer"></div>
			</div>
		</div>
	</div>
	<div id="menu" class="modal fade" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">MENU</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<div class="options">
						
					</div>
				</div>
				<div class="modal-footer"></div>
			</div>
		</div>
	</div>
	<div id="debug"></div>
	<div id="tooltip"></div>
	<div id="title-screen">
		<div id="loading-symbols-container">
			<div id="loading-symbols"></div>
			<div id="title-click-instruction">Click to continue</div>
		</div>
		<div id="save-selector-btn">Save Files</div>
	</div>
	<div id="loading-screen">
		Loading...
	</div>
</body>

</html>
