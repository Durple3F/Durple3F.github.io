<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Demon Bluff</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
	<script src="main.js" type="module" defer></script>
</head>
<body>
	<div id="game">
		<div class="game-bg evil"></div>
		<div class="game-bg good"></div>
		<div class="pentagram-container evil">
			<div class="pentagram"></div>
		</div>
		<div class="pentagram-container good">
			<div class="pentagram"></div>
		</div>
		<div class="ui-info">
			<div class="ui-text left objective"></div>
		</div>
		<div id="characters-bg"></div>
		<div id="characters"></div>
		<div class="ui-hints"></div>
		<div class="ui-instruction"></div>
		<div class="health-container">
			<div class="button-gradient-bg"></div>
			<div class="circle">
				<div class="bar" style="height: 100%"></div>
				<div class="values">
					<div class="current">10</div>
					<div>/</div>
					<div class="max">10</div>
				</div>
			</div>
		</div>
		<div class="dagger-button">
			<div class="clock-container">
				<div class="hour-indicator" id="hour-1" data-hour="1">
					<div class="hour-bg"></div>
					<div class="hour-fill"></div>
				</div>
				<div class="hour-indicator" id="hour-2" data-hour="2">
					<div class="hour-bg"></div>
					<div class="hour-fill"></div>
				</div>
				<div class="hour-indicator" id="hour-3" data-hour="3">
					<div class="hour-bg"></div>
					<div class="hour-fill"></div>
				</div>
				<div class="hour-indicator hour-night" id="hour-4" data-hour="4">
					<div class="hour-bg"></div>
				</div>
				<div class="clock-hand">
					<img src="src/img/icons/clockArm.png">
				</div>
			</div>
			<div class="button-gradient-bg back"></div>
			<div class="button-gradient-bg evil"></div>
			<div class="button-gradient-bg good"></div>
			<div class="dagger">
				<img src="src/dagger 1.png">
			</div>
			<div class="button-bg">
				<img src="src/DaggerBg3.png">
			</div>
		</div>
	</div>
</body>
</html>
