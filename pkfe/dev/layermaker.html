<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="layermaker.css">
	<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
	<script language="javascript" src="lz-string.min.js"></script>
	<script type="module" src="layermaker.js" defer></script>
	<link rel="icon" type="image/ico" sizes="16x16" href="/favicon.ico">
	<title>Layer Maker</title>
</head>

<body>
	<div id="tools">
		<select id="tool-picker">
			<option value="paint">Paint</option>
			<option value="bucket">Bucket</option>
		</select>
		<select id="tileset-picker"></select>
		<div>
			<label>Map Width:</label>
			<input type="number" value="32" id="map-width">
		</div>
		<div>
			<label>Map Height:</label>
			<input type="number" value="32" id="map-height">
		</div>
		<button id="update-btn">Update</button>
		<textarea id="data"></textarea>
	</div>
	<div id="canvas">
		<canvas></canvas>
	</div>
	<div id="tileset">
		<canvas></canvas>
	</div>
</body>

</html>
